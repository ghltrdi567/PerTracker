name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build PerFunTracker.slnx
      # ubuntu-latest runners have Docker, so [DockerFact] integration
      # tests run in full (Testcontainers), not skipped.
      - run: dotnet test PerFunTracker.slnx --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # build = tsc -b && vite build (type-check + bundle)
      - run: npm run build
