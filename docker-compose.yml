services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: perfuntracker
      POSTGRES_USER: perfun
      POSTGRES_PASSWORD: perfun_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfun -d perfuntracker"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=perfuntracker;Username=perfun;Password=perfun_dev;Include Error Detail=true"
      Smtp__Host: mailhog
      Smtp__Port: "1025"
    ports:
      - "127.0.0.1:5134:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"

  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["dev", "staging"]
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
